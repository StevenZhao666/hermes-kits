<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电脑钢琴 · 免安装</title>
<style>
  :root{
    --key-white:#f7f7f5;
    --key-black:#2b2b2b;
    --accent:#e0a92c;
    --panel:#1e1f24;
    --panel2:#2a2b31;
    --text:#e8e8e6;
    --muted:#9a9a98;
  }
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#26272c 0%,#1a1b1f 100%);
    color:var(--text);
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:16px 12px 20px;gap:14px;
  }
  h1{font-size:18px;font-weight:600;letter-spacing:.5px;color:var(--text);display:flex;align-items:center;gap:10px;}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  /* top control bar */
  .bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid #33343b;border-radius:12px;
    padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .bar .group{display:flex;align-items:center;gap:6px;padding:0 8px;border-left:1px solid #3a3b42;}
  .bar .group:first-child{border-left:none;}
  .bar label{font-size:12px;color:var(--muted);}
  button.btn{
    background:var(--panel2);color:var(--text);border:1px solid #3f4048;
    border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;transition:.15s;
  }
  button.btn:hover{background:#34353c;border-color:#55565f;}
  button.btn:active{transform:scale(.96);}
  button.btn.primary{background:var(--accent);color:#1a1a1a;border-color:transparent;font-weight:600;}
  button.btn.primary:hover{background:#eebb45;}
  button.btn.toggled{background:var(--accent);color:#1a1a1a;border-color:transparent;}
  .oct{font-size:14px;font-weight:700;color:var(--accent);min-width:56px;text-align:center;font-variant-numeric:tabular-nums;}
  button.btn.timbre{min-width:70px;}
  button.btn.timbre.selected{background:var(--accent);color:#1a1a1a;border-color:transparent;font-weight:600;}
  input[type=range]{width:110px;accent-color:var(--accent);cursor:pointer;}
  /* piano */
  .piano-wrap{
    width:100%;max-width:1100px;background:#0e0f12;border-radius:14px;
    padding:14px;border:1px solid #303138;box-shadow:0 14px 30px rgba(0,0,0,.45);
  }
  .piano{
    position:relative;height:300px;display:flex;border:3px solid #111;border-radius:4px;
    overflow:hidden;background:#000;touch-action:none;
  }
  .white{
    flex:1;background:linear-gradient(#fff 0%,#f4f4f2 90%,#e4e4e2 100%);
    border-right:1px solid #b9b9b6;cursor:pointer;position:relative;
    border-bottom:6px solid #c9c9c6;border-radius:0 0 3px 3px;transition:background .05s;
  }
  .white:last-child{border-right:none;}
  .white.active{background:linear-gradient(#f2e3bd 0%,#ecdcae 100%);border-bottom-color:#d8b95c;}
  .white .label{
    position:absolute;bottom:10px;left:0;right:0;text-align:center;
    font-size:11px;color:#7a7a77;font-weight:600;pointer-events:none;
  }
  .key-badge{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    font-size:10px;font-weight:700;color:#8a6d1e;pointer-events:none;
    background:rgba(224,169,44,.18);border:1px solid rgba(224,169,44,.5);
    border-radius:4px;padding:0 3px;min-width:13px;text-align:center;line-height:1.4;
  }
  .white .key-badge{color:#8a6d1e;}
  .black .key-badge{
    color:#ffe9b0;background:rgba(0,0,0,.55);border-color:rgba(255,233,176,.35);top:22%;
  }
  .black{
    position:absolute;top:0;height:60%;width:4.2%;
    background:linear-gradient(#3a3a3a,#1c1c1c 55%,#111 100%);
    border:1px solid #000;border-top:none;border-radius:0 0 4px 4px;
    cursor:pointer;z-index:3;box-shadow:0 4px 6px rgba(0,0,0,.5);
  }
  .black.active{background:linear-gradient(#e8b94a,#d8a52c 60%,#c1931c 100%);}
  .black .label{
    position:absolute;bottom:6px;left:0;right:0;text-align:center;
    font-size:9px;color:#d0d0d0;font-weight:600;pointer-events:none;
  }
  .hint{font-size:12px;color:var(--muted);line-height:1.7;text-align:center;}
  .hint b{color:#c9c9c6;font-weight:600;}
  kbd{
    background:#33343b;border:1px solid #4a4b54;border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;font-size:11px;color:#e8e8e6;font-family:inherit;
  }
  @media (max-width:640px){
    .piano{height:220px;}
    .hint{display:none;}
  }
</style>
</head>
<body>

  <h1><span class="dot"></span>电脑钢琴 <small style="font-size:12px;font-weight:400;color:var(--muted)">免安装 · 点击/键盘弹奏</small></h1>

  <div class="bar">
    <div class="group">
      <label>音域</label>
      <button class="btn" id="octDown" title="降八度 (Z)">−</button>
      <span class="oct" id="octLabel">C3–B4</span>
      <button class="btn" id="octUp" title="升八度 (X)">+</button>
    </div>
    <div class="group">
      <label>音量</label>
      <input type="range" id="volume" min="0" max="100" value="80">
    </div>
    <div class="group">
      <label>音色</label>
      <button class="btn timbre" data-timbre="piano">🎹 钢琴</button>
      <button class="btn timbre" data-timbre="violin">🎻 小提琴</button>
      <button class="btn timbre" data-timbre="organ">🎬 风琴</button>
    </div>
    <div class="group">
      <label>延音</label>
      <button class="btn" id="sustainToggle" title="延音踏板 (空格)">延音: <span id="sustainState">关</span></button>
    </div>
    <div class="group">
      <button class="btn primary" id="playDemo" title="听个小示范">▶ 示范</button>
    </div>
  </div>

  <div class="piano-wrap">
    <div class="piano" id="piano"></div>
  </div>

  <div class="hint">
    <b>双手弹奏</b>：白键 <kbd>z</kbd><kbd>x</kbd><kbd>c</kbd><kbd>v</kbd><kbd>b</kbd><kbd>n</kbd><kbd>m</kbd><kbd>,</kbd><kbd>.</kbd><kbd>/</kbd>（左手，从 <b>A2</b> 起）与 <kbd>q</kbd><kbd>w</kbd><kbd>e</kbd><kbd>r</kbd><kbd>t</kbd><kbd>y</kbd><kbd>u</kbd><kbd>i</kbd><kbd>o</kbd><kbd>p</kbd><kbd>[</kbd><kbd>]</kbd><kbd>、</kbd>（右手，从 <b>G</b> 起），
    黑键 <kbd>s</kbd><kbd>f</kbd><kbd>g</kbd><kbd>j</kbd><kbd>k</kbd><kbd>l</kbd><kbd>'</kbd>（左手）与 <kbd>2</kbd><kbd>3</kbd><kbd>5</kbd><kbd>6</kbd><kbd>8</kbd><kbd>9</kbd><kbd>0</kbd><kbd>=</kbd>（右手）。
    <kbd>↑</kbd>/<kbd>↓</kbd> 换音域，<kbd>空格</kbd> 延音，也可鼠标点琴键。
  </div>

<script>
/* ============ 音频引擎：加法合成钢琴音色 ============ */
const AudioEngine = (() => {
  let ctx = null;
  let master = null;

  function ensureCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.8;
      // 动态压缩器：多键叠加时防止削波/爆音，让和弦更稳（先压缩再分配干湿）
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.knee.value = 10;
      comp.ratio.value = 6;
      comp.attack.value = 0.003;
      comp.release.value = 0.15;
      master.connect(comp);
      // 轻微混响（缩短IR，多键更省CPU）
      const convolver = ctx.createConvolver();
      convolver.buffer = makeImpulse(0.9, 2.6);
      const wet = ctx.createGain(); wet.gain.value = 0.14;
      const dry = ctx.createGain(); dry.gain.value = 0.9;
      comp.connect(dry);
      comp.connect(convolver);
      convolver.connect(wet);
      dry.connect(ctx.destination);
      wet.connect(ctx.destination);
      // 半秒淡入避免爆音
      master.gain.setValueAtTime(0, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.8, ctx.currentTime + 0.4);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function makeImpulse(duration, decay) {
    const rate = ctx.sampleRate;
    const len = Math.floor(rate * duration);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  // ============ 音色预设 ============
  // 每种音色：音源类型 / 泛音 / 起音秒 / 是否衰减(敲击) / 保持 / 颤音 / 释放秒
  const TIMBRES = {
    piano: {
      wave:'sine',
      partials:[{r:1.0,a:1.00},{r:2.0,a:0.32},{r:3.0,a:0.16},{r:4.0,a:0.09}],
      attack:0.004, decay:true, sustainGain:0.001, release:0.4, vibrato:0,
    },
    violin: {
      wave:'sawtooth',
      partials:[{r:1.0,a:1.00},{r:2.0,a:0.55},{r:3.0,a:0.32},{r:4.0,a:0.20},{r:5.0,a:0.12},{r:6.0,a:0.08}],
      attack:0.16, decay:false, sustainGain:0.62, release:0.28, vibrato:5.6,
    },
    organ: {
      wave:'sine',
      partials:[{r:1.0,a:1.00},{r:2.0,a:0.45},{r:3.0,a:0.28},{r:4.0,a:0.18}],
      attack:0.01, decay:false, sustainGain:0.9, release:0.06, vibrato:0,
    },
  };
  let currentTimbre = 'piano';

  function getTimbre() { return TIMBRES[currentTimbre] || TIMBRES.piano; }
  function setTimbre(name) { if (TIMBRES[name]) { currentTimbre = name; return true; } return false; }

  // 发出一个音符，返回 {stop(fast):void}
  function note(freq, velocity) {
    const c = ensureCtx();
    const t = c.currentTime;
    const tb = getTimbre();
    const dur = tb.decay ? 7 : 3.2;            // 衰减型(钢琴)余音长；持续型(弦乐)可避免过久
    const out = c.createGain();
    out.gain.value = 1;
    out.connect(master);

    const oscs = [];
    // 颤音 LFO（仅小提琴等需要）
    let vibOsc = null, vibGain = null;
    if (tb.vibrato > 0) {
      vibOsc = c.createOscillator();
      vibOsc.frequency.value = tb.vibrato;
      vibGain = c.createGain();
      vibGain.gain.value = 0;                  // 起音后再开颤音
      vibOsc.connect(vibGain);
      vibGain.connect(out.gain);               // 让颤音影响整体音量（轻微起伏）
      vibOsc.start(t);
      vibOsc.stop(t + dur + 1);
      oscs.push(vibOsc);
    }

    tb.partials.forEach(p => {
      const o = c.createOscillator();
      o.type = tb.wave;
      // 轻微随机失谐，让每次按键音色略有不同
      const detune = (Math.random() - 0.5) * 4;
      o.frequency.value = freq * p.r;
      o.detune.value = detune;
      const g = c.createGain();
      const peak = p.a * velocity * 0.34;
      g.gain.setValueAtTime(0, t);
      // 起音
      g.gain.linearRampToValueAtTime(peak, t + tb.attack);
      if (tb.decay) {
        // 敲击型：衰减
        g.gain.exponentialRampToValueAtTime(peak * tb.sustainGain, t + dur);
      } else {
        // 持续型：起音后保持
        g.gain.setValueAtTime(peak, t + tb.attack + 0.01);
        g.gain.linearRampToValueAtTime(peak * tb.sustainGain, t + tb.attack + 0.08);
      }
      o.connect(g);
      g.connect(out);
      o.start(t);
      o.stop(t + dur + 2);
      oscs.push(o);
    });

    // 颤音量按起音淡入，避免按键瞬间“抖”
    if (vibGain) {
      vibGain.gain.setValueAtTime(0, t);
      vibGain.gain.linearRampToValueAtTime(0.05, t + tb.attack + 0.25);
    }

    return {
      stop(fast) {
        const now = c.currentTime;
        // 快速收尾，按音色释放时间
        const relT = tb.release * (fast ? 0.3 : 1);
        out.gain.cancelScheduledValues(now);
        out.gain.setValueAtTime(out.gain.value, now);
        out.gain.linearRampToValueAtTime(0.0001, now + Math.max(0.02, relT));
        const stopT = now + Math.max(0.06, relT + 0.08);
        oscs.forEach(o => { try { o.stop(stopT); } catch(e){} });
        setTimeout(() => { try { out.disconnect(); } catch(e){} }, stopT * 1000 + 60);
      }
    };
  }

  function setVolume(v) { if (master) master.gain.value = v; }

  return { ensureCtx, note, setVolume, setTimbre, getTimbreName: () => currentTimbre, TIMBRES };
})();

/* ============ 键位与音符 ============ */
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function midiToName(m) { return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1); }

// 白键的十二平均律索引（相对 C=0）
const WHITE_SEMI = [0,2,4,5,7,9,11];
// ============ 折叠式双手钢琴：白键两行 + 黑键按物理缝隙嵌两行 ============
// 白键：左手低音组 = zxcv 行，右手高音组 = qwerty 行（每组完整八度 C D E F G A B + 延伸）
// 黑键：数字行(配高词组) + home 行(配低词组)，物理上嵌在相邻白键之间的缝隙里。
// 落在 E－F / B－C 之间的键（无黑键处）闲置。偏移量 = 相对各自基准 C 的半音数。
//
// 左/低音组(zxcv 行，z=A2) 白键: z  x  c  v  b  n  m  ,  .  /
//                                A2 B2 C3 D3 E3 F3 G3 A3 B3 C4
// 右/高音组(qwerty 行，q=G3) 白键: q  w  e  r  t  y  u  i  o  p  [  ]  、
//                                G3 A3 B3 C4 D4 E4 F4 G4 A4 B4 C5 D5 E5
// 黑键(高音·数字行 2 3 5 6 8 9 0 =):  2  3     5  6     8  9  0  =
//                                     G#3 A#3  C#4 D#4  F#4 G#4 A#4 C#5
// 黑键(低音·home 行 s f g j k l '):     s  f  g  j  k  l  '
//                                     A#2 C#3 D#3 F#3 G#3 A#3 C#4
// 闲置键：数字行 1 4 7（落 B-C / E-F 缝隙，无黑键）。

// —— 高音组（右手）白键（相对基准 G 偏移，从 G 开始）——
// q w e r t y u i o p [ ] 、 = G3 A3 B3 C4 D4 E4 F4 G4 A4 B4 C5 D5 E5
const WHITE_HI = {
  'KeyQ':0,'KeyW':2,'KeyE':4,'KeyR':5,'KeyT':7,'KeyY':9,'KeyU':10,
  'KeyI':12,'KeyO':14,'KeyP':16,'BracketLeft':17,'BracketRight':19,
  'Backslash':21   // 顿号键「、」= E5
};
// —— 低音组（左手）白键（相对基准 A2 偏移，z = A2）——
// z x c v b n m , . /   =  A2 B2 C3 D3 E3 F3 G3 A3 B3 C4
const WHITE_LO = {
  'KeyZ':0,'KeyX':2,'KeyC':3,'KeyV':5,'KeyB':7,'KeyN':8,'KeyM':10,
  'Comma':12,'Period':14,'Slash':15
};
// —— 高音组黑键（数字行 2 3 5 6 8 9 0 =，从 G 起物理缝隙对位）——
// 2 3 5 6 = G♯3 A♯3 C♯4 D♯4；8 9 0 = = F♯4 G♯4 A♯4 C♯5（跳过 1 4 7：B-C/E-F 无黑键）
const BLACK_HI = {
  'Digit2':1,'Digit3':3,'Digit5':6,'Digit6':8,
  'Digit8':11,'Digit9':13,'Digit0':15,'Equal':18
};
// —— 低音组黑键（home 行：s f g j k l '，f = C♯3 按你指定）——
// 相对 A2 偏移：s=A♯2 f=C♯3 g=D♯3 j=F♯3 k=G♯3 l=A♯3 '=C♯4
const BLACK_LO = {
  'KeyS':1,'KeyF':4,'KeyG':6,'KeyJ':9,'KeyK':11,'KeyL':13,'Quote':16
};

// 键位说明（供标注/提示用）：E.code -> 显示名
const CODE_NAME = {
  'KeyQ':'q','KeyW':'w','KeyE':'e','KeyR':'r','KeyT':'t','KeyY':'y','KeyU':'u',
  'KeyI':'i','KeyO':'o','KeyP':'p','BracketLeft':'[','BracketRight':']','Backslash':'、',
  'KeyZ':'z','KeyX':'x','KeyC':'c','KeyV':'v','KeyB':'b','KeyN':'n','KeyM':'m',
  'Comma':',','Period':'.','Slash':'/',
  'Digit1':'1','Digit2':'2','Digit3':'3','Digit4':'4','Digit5':'5','Digit6':'6','Digit7':'7','Digit8':'8','Digit9':'9','Digit0':'0',
  'Equal':'=','KeyS':'s','KeyF':'f','KeyG':'g','KeyJ':'j','KeyK':'k','KeyL':'l','Quote':"'"
};

/* ---- E.code -> midi 解析 + midi -> 键名反向标注 ---- */
// 右手组基准 G（默认 baseOctave=4 时 q=G3=55，比原 C4 低 5 个半音）。
// 左手组基准随右手同步移动（相低 10 半音），默认 z=A2=45；↑/↓ 换音域左右手一起动。
function hiBase() { return (baseOctave + 1) * 12 - 5; }   // baseOctave=4 → G3(55)
function loBase() { return hiBase() - 10; }               // 55-10=A2(45)，使默认 z=A2

// 某个物理键触发时对应的 midi（无映射返回 null）
function codeToMidi(code) {
  if (WHITE_HI[code] != null) return hiBase() + WHITE_HI[code];
  if (WHITE_LO[code] != null) return loBase() + WHITE_LO[code];
  if (BLACK_HI[code] != null) return hiBase() + BLACK_HI[code];
  if (BLACK_LO[code] != null) return loBase() + BLACK_LO[code];
  return null;
}

// 反向：midi -> 物理键的显示名（供琴键上标注），无映射返回空
function midiToCodeName(midi) {
  const h = hiBase(), l = loBase();
  for (const [code, off] of Object.entries(WHITE_HI))
    if (h + off === midi) return CODE_NAME[code];
  for (const [code, off] of Object.entries(WHITE_LO))
    if (l + off === midi) return CODE_NAME[code];
  for (const [code, off] of Object.entries(BLACK_HI))
    if (h + off === midi) return CODE_NAME[code];
  for (const [code, off] of Object.entries(BLACK_LO))
    if (l + off === midi) return CODE_NAME[code];
  return '';
}


/* ============ 状态 ============ */
let baseOctave = 4;          // 高音组基准八度（hiBase=C4，低音组 loBase=C2，比右手低两个八度）
let sustain = false;
let activeVoices = new Map(); // midi -> {voiceId, voice, el}
let pressedKeys = new Map();  // keyboardKey -> midi
let idCounter = 0;

/* ============ 渲染钢琴 ============ */
const pianoEl = document.getElementById('piano');
const octLabel = document.getElementById('octLabel');

function renderPiano() {
  pianoEl.innerHTML = '';
  const whiteCount = 21;                        // 3 个八度的白键
  // 生成白键
  let whiteMidis = [];
  let m = loBase();                             // 从低音组 z(A2) 开始，能看到低音+高音两组
  while (whiteMidis.length < whiteCount) {
    const semi = ((m % 12) + 12) % 12;
    if (WHITE_SEMI.includes(semi)) whiteMidis.push(m);
    m++;
  }
  const blackMidis = [];
  for (let i = 0; i < whiteMidis.length - 1; i++) {
    const cur = whiteMidis[i];
    const next = whiteMidis[i + 1];
    for (let mm = cur + 1; mm < next; mm++) blackMidis.push(mm);
  }

  // 每个 midi 对应的键盘字母（若无映射返回空）
  function keyLabelFor(midi) {
    return midiToCodeName(midi);
  }

  whiteMidis.forEach((midi) => {
    const key = document.createElement('div');
    key.className = 'white';
    key.dataset.midi = midi;
    const semi = ((midi % 12) + 12) % 12;
    const kl = keyLabelFor(midi);
    if (kl) {
      const bg = document.createElement('span');
      bg.className = 'key-badge';
      bg.textContent = kl;
      key.appendChild(bg);
    }
    const lb = document.createElement('span');
    lb.className = 'label';
    lb.textContent = (semi === 0 ? midiToName(midi) : '');
    key.appendChild(lb);
    pianoEl.appendChild(key);
  });

  const whiteW = 100 / whiteMidis.length;
  blackMidis.forEach(midi => {
    const key = document.createElement('div');
    key.className = 'black';
    key.dataset.midi = midi;
    const lowerWhite = whiteMidis.filter(w => w < midi).pop();
    const whiteIdx = whiteMidis.indexOf(lowerWhite);
    const kl = keyLabelFor(midi);
    if (kl) {
      const bg = document.createElement('span');
      bg.className = 'key-badge';
      bg.textContent = kl;
      key.appendChild(bg);
    }
    const semi = ((midi % 12) + 12) % 12;
    if (semi === 1 || semi === 6) {
      const lb = document.createElement('span');
      lb.className = 'label';
      lb.textContent = midiToName(midi).replace('#','♯');
      key.appendChild(lb);
    }
    key.style.left = ((whiteIdx + 1) * whiteW - 2.1) + '%';
    pianoEl.appendChild(key);
  });

  const endMidi = whiteMidis[whiteMidis.length - 1];
  const startMidi = whiteMidis[0];
  octLabel.textContent = `${midiToName(startMidi).replace(/#.*/,'')}${Math.floor(startMidi/12)-1}–${midiToName(endMidi).replace(/#.*/,'')}${Math.floor(endMidi/12)-1}`;

  attachKeyHandlers();
}

/* ============ 发声控制 ============ */
function playNote(midi, speed = 1) {
  if (activeVoices.has(midi)) return;
  AudioEngine.ensureCtx();
  const voice = AudioEngine.note(midiToFreq(midi), Math.min(1, speed) * 0.9);
  const id = ++idCounter;
  activeVoices.set(midi, { id, voice });
  // 高亮对应琴键
  const el = document.querySelector(`.piano [data-midi="${midi}"]`);
  if (el) el.classList.add('active');
  return id;
}

function releaseNote(midi, fast = false) {
  const rec = activeVoices.get(midi);
  if (!rec) return;
  if (sustain && !fast) return; // 延音踏板按住不放
  rec.voice.stop(fast);
  activeVoices.delete(midi);
  const el = document.querySelector(`.piano [data-midi="${midi}"]`);
  if (el) el.classList.remove('active');
}

function releaseAll(fast) {
  for (const [midi, rec] of [...activeVoices]) {
    rec.voice.stop(fast);
    activeVoices.delete(midi);
    const el = document.querySelector(`.piano [data-midi="${midi}"]`);
    if (el) el.classList.remove('active');
  }
}

function shiftOctave(delta) {
  baseOctave = Math.max(1, Math.min(6, baseOctave + delta));
  renderPiano();
}

/* ============ 交互事件 ============ */
function attachKeyHandlers() {
  pianoEl.querySelectorAll('.white,.black').forEach(elm => {
    elm.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const midi = parseInt(elm.dataset.midi, 10);
      playNote(midi);
    });
    elm.addEventListener('pointerup', (e) => {
      const midi = parseInt(elm.dataset.midi, 10);
      releaseNote(midi, false);
    });
    elm.addEventListener('pointerleave', (e) => {
      const midi = parseInt(elm.dataset.midi, 10);
      releaseNote(midi, false);
    });
  });
  // 黑键比白键层级高，允许滑奏（在白键之间滑动不触发相邻键误触）
  // 这里为简单：mouseleave 处理释放
}

function handleNoteOn(midi) {
  if (midi == null) return;
  playNote(midi);
}
function handleNoteOff(midi) {
  if (midi == null) return;
  releaseNote(midi, false);
}

document.addEventListener('keydown', (e) => {
  const code = e.code;
  // 防止空格/方向键滚动页面
  if (code === 'Space' || code === 'ArrowUp' || code === 'ArrowDown') e.preventDefault();
  // 避免长按重复
  if (e.repeat) return;

  // 音域切换：方向键 ↑（上移）↓（下移），- 也可下移
  if (code === 'ArrowUp') { shiftOctave(1); return; }
  if (code === 'ArrowDown' || code === 'Minus') { shiftOctave(-1); return; }
  if (code === 'Space') { setSustain(true); return; }

  const midi = codeToMidi(code);
  if (midi != null) {
    e.preventDefault();
    if (!pressedKeys.has(code)) {
      pressedKeys.set(code, midi);
      playNote(midi);
    }
  }
});

document.addEventListener('keyup', (e) => {
  const code = e.code;
  if (code === 'Space') { setSustain(false); releaseAll(true); return; }
  const midi = pressedKeys.get(code);
  if (midi != null) {
    releaseNote(midi, false);
    pressedKeys.delete(code);
  }
});

function setSustain(on) {
  sustain = on;
  const stateEl = document.getElementById('sustainState');
  stateEl.textContent = on ? '开' : '关';
  document.getElementById('sustainToggle').classList.toggle('toggled', on);
}

/* ============ 控件绑定 ============ */
document.getElementById('octDown').addEventListener('click', () => shiftOctave(-1));
document.getElementById('octUp').addEventListener('click', () => shiftOctave(1));
document.getElementById('sustainToggle').addEventListener('click', () => setSustain(!sustain));
// 音色切换：点击按钮切换音色，并高亮当前选中
document.querySelectorAll('button.timbre').forEach(btn => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.timbre;
    if (AudioEngine.setTimbre(name)) {
      document.querySelectorAll('button.timbre').forEach(b => b.classList.toggle('selected', b === btn));
    }
  });
});
// 默认选中「钢琴」
document.querySelector('button.timbre[data-timbre="piano"]').classList.add('selected');
document.getElementById('volume').addEventListener('input', (e) => {
  AudioEngine.setVolume(e.target.value / 100);
});
document.getElementById('playDemo').addEventListener('click', () => {
  const melody = [60,62,64,67,64,60,62,67]; // C D E G E C D G 简短的示范
  // 用小星星
  const song = [60,60,67,67,69,69,67,65,65,64,64,62,62,60];
  song.forEach((midi, i) => {
    setTimeout(() => playNote(midi), i * 320);
    setTimeout(() => releaseNote(midi, true), i * 320 + 300);
  });
});

// 首次点击页面时确保音频激活（浏览器要求用户手势后才能出声）
document.body.addEventListener('pointerdown', () => AudioEngine.ensureCtx(), { once: true });

// 初始化
renderPiano();
</script>
